<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studio Slot (design prototype)</title>
<meta name="description" content="Runnable design prototype for Studio Slot. Data lives in memory only; no server is involved.">
<style>
:root{
  --oat:#F4F1EA; --surface:#FFFFFF; --ink:#23302B; --muted:#566359;
  --sage:#2F5D4E; --sage-soft:#DCE8E1; --on-sage:#FFFFFF;
  --clay:#9C4A2F; --clay-soft:#F3DDD3; --err:#A32D2D; --err-soft:#F6DEDE;
  --full:#E6E3DA; --edge:#7B8A80; --line:#D8D3C6; --focus:#0B5CAD;
  --font:Optima,Candara,"Gill Sans","Gill Sans MT","Trebuchet MS",system-ui,sans-serif;
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;--s7:48px;--s8:72px;
  --r-md:14px;--r-lg:24px;--r-pill:999px;
  --shadow:0 1px 2px rgba(35,48,43,.06),0 10px 30px -14px rgba(35,48,43,.22);
  --ease:cubic-bezier(.22,.7,.2,1);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--oat);color:var(--ink);font:400 1.0625rem/1.55 var(--font);min-height:100vh}
h1,h2,h3{font-weight:500;letter-spacing:.01em;line-height:1.2;margin:0}
h1{font-size:clamp(1.9rem,5.5vw,2.75rem)}
h2{font-size:1.4rem}
h3{font-size:1.15rem}
p{margin:0}
a{color:var(--sage)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:8px}
main:focus{outline:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:var(--s4);top:-60px;background:var(--ink);color:var(--oat);padding:var(--s2) var(--s4);border-radius:var(--r-md);z-index:50}
.skip:focus{top:var(--s2)}

/* Header */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s3) var(--s5);padding:var(--s4) var(--s4);max-width:960px;margin:0 auto}
.brand{display:flex;align-items:center;gap:var(--s3);font-size:1.35rem;font-weight:500;letter-spacing:.02em;margin-right:auto;text-decoration:none;color:var(--ink)}
.sun{width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 50% 50%,var(--sage) 0 28%,var(--sage-soft) 29% 55%,transparent 56%);box-shadow:0 0 0 1px var(--sage-soft)}
nav{display:flex;gap:var(--s2);flex-wrap:wrap}
nav a{padding:var(--s2) var(--s4);border-radius:var(--r-pill);text-decoration:none;color:var(--muted);min-height:44px;display:inline-flex;align-items:center;font-weight:500}
nav a:hover{background:var(--sage-soft);color:var(--ink)}
nav a[aria-current=page]{background:var(--sage);color:var(--on-sage)}
@media (max-width:639px){nav{width:100%}nav a{flex:1 1 auto;justify-content:center;padding:var(--s2) var(--s3);font-size:.9375rem}}
main{max-width:960px;margin:0 auto;padding:var(--s4) var(--s4) var(--s8)}
.hero{padding:var(--s5) 0 var(--s5)}
.hero p{color:var(--muted);max-width:44ch;margin-top:var(--s3)}
.studio-tz{display:inline-flex;align-items:center;gap:var(--s2);margin-top:var(--s4);padding:var(--s1) var(--s3);border-radius:var(--r-pill);background:var(--sage-soft);font-size:.9375rem}

/* Cards and buttons */
.card{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow);border:1px solid var(--line)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);min-height:48px;padding:0 var(--s5);border-radius:var(--r-pill);border:1.5px solid var(--sage);background:transparent;color:var(--sage);cursor:pointer;font-weight:500;text-decoration:none;transition:background .2s var(--ease),transform .15s var(--ease)}
.btn:hover{background:var(--sage-soft)}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--sage);color:var(--on-sage)}
.btn.primary:hover{background:#264d41}
.btn.danger{border-color:var(--err);color:var(--err)}
.btn.danger:hover{background:var(--err-soft)}
.btn[disabled],.btn[aria-disabled=true]{border-color:var(--edge);color:var(--muted);background:var(--full);cursor:not-allowed}
.stack{display:grid;gap:var(--s4)}

/* Schedule */
.day{margin-top:var(--s6)}
.day h2{position:sticky;top:0;background:linear-gradient(var(--oat) 78%,transparent);padding:var(--s3) 0 var(--s2);z-index:2}
.cls{display:grid;grid-template-columns:auto 1fr auto;gap:var(--s2) var(--s5);align-items:center;padding:var(--s4) var(--s5);margin-top:var(--s3);animation:rise .4s var(--ease) both}
.cls .when{font-size:1.2rem;font-weight:500;min-width:7.5rem}
.cls .when small{display:block;font-size:.875rem;font-weight:400;color:var(--muted)}
.cls .what small{display:block;color:var(--muted);font-size:.9375rem}
.badge{display:inline-block;padding:2px var(--s3);border-radius:var(--r-pill);font-size:.875rem;font-weight:500;background:var(--sage-soft);color:var(--ink)}
.badge.few{background:var(--clay-soft);color:var(--clay)}
.badge.full,.badge.cancelled{background:var(--full);color:var(--muted)}
.cls.is-cancelled .what h3{text-decoration:line-through;color:var(--muted)}
@media (max-width:639px){.cls{grid-template-columns:1fr auto}.cls .when{grid-column:1/-1}.cls .act{grid-column:1/-1}.cls .act .btn{width:100%}}

/* Forms */
form.card{padding:var(--s5)}
.field{display:grid;gap:var(--s1);font-weight:500}
.input{min-height:50px;padding:0 var(--s4);border-radius:var(--r-md);border:1.5px solid var(--edge);background:var(--surface);width:100%;font-weight:400}
.input[aria-invalid=true]{border-color:var(--err)}
.err{color:var(--err);font-size:.9375rem;min-height:1.3rem;font-weight:500}
.hp{position:absolute;left:-9999px;height:0;overflow:hidden}
.grid2{display:grid;gap:var(--s4);grid-template-columns:1fr 1fr}
@media (max-width:639px){.grid2{grid-template-columns:1fr}}
.notice{padding:var(--s4) var(--s5);border-radius:var(--r-md);background:var(--clay-soft);color:var(--ink);border:1px solid var(--clay)}
.notice.err-box{background:var(--err-soft);border-color:var(--err)}
.empty{text-align:center;padding:var(--s7) var(--s5);color:var(--muted)}
.empty h2{color:var(--ink);margin-bottom:var(--s2)}
.skel{height:84px;border-radius:var(--r-lg);background:linear-gradient(90deg,#ece8de,#f7f5ef,#ece8de);background-size:200% 100%;animation:shimmer 1.4s linear infinite;margin-top:var(--s3)}

/* Confirmation */
.confirm{padding:var(--s6) var(--s5);text-align:center;display:grid;gap:var(--s4);justify-items:center}
.breath{width:84px;height:84px;border-radius:50%;background:radial-gradient(circle,var(--sage) 0 30%,var(--sage-soft) 31% 100%);animation:breathe 5s ease-in-out infinite}
.code{font-size:clamp(1.1rem,6.2vw,1.9rem);letter-spacing:.12em;white-space:nowrap;font-weight:500;padding:var(--s3) var(--s5);border:2px dashed var(--sage);border-radius:var(--r-md);background:var(--sage-soft);user-select:all}

/* Admin */
.rost{margin:var(--s3) 0 0;padding:0;list-style:none;display:grid;gap:var(--s1);color:var(--muted);font-size:.9375rem}
.acls{padding:var(--s4) var(--s5);margin-top:var(--s3);display:grid;gap:var(--s2)}
.acls header{display:flex;flex-wrap:wrap;gap:var(--s2) var(--s4);align-items:center;justify-content:space-between}

dialog{border:1px solid var(--edge);border-radius:var(--r-lg);padding:var(--s5);max-width:min(440px,calc(100vw - 32px));background:var(--surface);color:var(--ink);box-shadow:0 30px 70px -24px rgba(35,48,43,.5)}
dialog::backdrop{background:rgba(35,48,43,.5)}
dialog .row{display:flex;justify-content:flex-end;gap:var(--s2);margin-top:var(--s5);flex-wrap:wrap}

.proto{position:sticky;bottom:0;background:var(--ink);color:var(--oat);padding:var(--s2) var(--s4);display:flex;flex-wrap:wrap;gap:var(--s2) var(--s5);align-items:center;font-size:.875rem;z-index:30}
@media (max-width:639px){.proto{position:static}}
.proto select{background:var(--oat);color:var(--ink);border-radius:8px;border:0;min-height:32px;padding:0 var(--s2)}
.proto label{display:inline-flex;gap:var(--s2);align-items:center}

@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes shimmer{to{background-position:-200% 0}}
@keyframes breathe{0%,100%{transform:scale(.9)}50%{transform:scale(1.08)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="top">
  <a class="brand" href="#/"><span class="sun" aria-hidden="true"></span>Studio Slot</a>
  <nav aria-label="Primary">
    <a href="#/" data-route="/">Schedule</a>
    <a href="#/cancel" data-route="/cancel">Cancel a booking</a>
    <a href="#/admin" data-route="/admin">Owner</a>
  </nav>
</header>
<main id="main" tabindex="-1"></main>
<div id="live" class="sr" role="status" aria-live="polite"></div>
<dialog id="dlg" aria-labelledby="dlg-t"><form method="dialog"><h2 id="dlg-t"></h2><p id="dlg-b" style="margin-top:8px"></p><div class="row"><button class="btn" value="cancel">Keep it</button><button class="btn danger" id="dlg-ok" value="ok"></button></div></form></dialog>
<div class="proto" role="region" aria-label="Prototype controls (not part of the product)">
  <strong>Prototype controls</strong>
  <label>Visitor timezone <select id="vtz"><option>Asia/Kolkata</option><option>Europe/London</option><option>America/New_York</option><option>Australia/Sydney</option></select></label>
  <label><input type="checkbox" id="outage"> Simulate API outage</label>
  <label><input type="checkbox" id="limit"> Simulate daily limit reached</label>
</div>

<script>
"use strict";
/* ---------- time (pure helpers; the real app puts these in shared/time.ts) ---------- */
const STUDIO_TZ = "Asia/Kolkata";   // UTC+5:30, no DST; configuration in the real app
const IST_MS = 5.5 * 3600e3;
const fmt = (tz, o) => new Intl.DateTimeFormat("en-GB", { timeZone: tz, ...o });
const timeIn = (ms, tz) => fmt(tz, { hour: "numeric", minute: "2-digit", hour12: true }).format(ms).replace(/\s?([ap])m/i, (_, x) => " " + x.toUpperCase() + "M");
const dayKeyIn = (ms, tz) => fmt(tz, { year: "numeric", month: "2-digit", day: "2-digit" }).format(ms).split("/").reverse().join("-");
const dayLabelIn = (ms, tz) => fmt(tz, { weekday: "long", day: "numeric", month: "long" }).format(ms);

/* ---------- seed data: instants from Kolkata wall-clock times ---------- */
const istMidnight = () => { const n = new Date(Date.now() + IST_MS); return Date.UTC(n.getUTCFullYear(), n.getUTCMonth(), n.getUTCDate()) - IST_MS; };
const at = (dayOffset, h, m) => istMidnight() + dayOffset * 86400e3 + (h * 60 + m) * 60e3;
let uid = 0; const id = () => "c" + (++uid);
const classes = [];
const templates = [["Sunrise Vinyasa", 6, 30, 60, 12], ["Gentle Flow", 8, 0, 60, 10], ["Yin and Restore", 18, 30, 75, 14]];
for (let d = 0; d < 14; d++) {
  const dow = new Date(istMidnight() + d * 86400e3 + IST_MS).getUTCDay();
  if (dow === 0) continue; // closed on Sundays
  for (const [t, h, m, dur, cap] of templates) classes.push({ id: id(), title: t, start: at(d, h, m), dur, cap, cancelled: false, roster: [] });
}
const fill = (c, n) => { for (let i = 0; i < n; i++) c.roster.push({ name: "Guest " + (i + 1), email: "guest" + (i + 1) + "@example.com", code: "SEED" + i }); };
const upcoming = () => classes.filter(c => c.start > Date.now()).sort((a, b) => a.start - b.start);
fill(upcoming()[0], upcoming()[0].cap);        // first class is full
fill(upcoming()[1], upcoming()[1].cap - 2);    // second has 2 spots left
upcoming()[4].cancelled = true;                // one cancelled class
const left = c => c.cap - c.roster.length;

/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const live = m => { const l = $("#live"); l.textContent = ""; setTimeout(() => l.textContent = m, 30); };
const visitorTz = () => $("#vtz").value;
const wait = ms => new Promise(r => setTimeout(r, ms));
const code = () => Array.from({ length: 3 }, () => Math.random().toString(36).slice(2, 6).toUpperCase().padEnd(4, "X")).join("-");
let session = false, lastBooking = null;

function confirmDialog(title, body, ok) {
  return new Promise(res => { const d = $("#dlg"); $("#dlg-t").textContent = title; $("#dlg-b").textContent = body; $("#dlg-ok").textContent = ok;
    d.addEventListener("close", () => res(d.returnValue === "ok"), { once: true }); d.returnValue = "cancel"; d.showModal(); });
}
async function api() { // simulated latency and failure modes
  await wait(350);
  if ($("#limit").checked) throw Object.assign(new Error("limit"), { kind: "limit" });
  if ($("#outage").checked) throw Object.assign(new Error("outage"), { kind: "outage" });
}
const failBox = e => e.kind === "limit"
  ? `<div class="notice" role="alert"><strong>We're at capacity for today.</strong> The booking service has reached its daily limit and resets at 5:30 AM IST. Please try again then, or contact the studio.</div>`
  : `<div class="notice err-box" role="alert"><strong>We couldn't reach the booking service.</strong> Check your connection and try again. Nothing was booked.</div>`;

function timeBlock(c) {
  const s = timeIn(c.start, STUDIO_TZ), e = timeIn(c.start + c.dur * 60e3, STUDIO_TZ), v = visitorTz();
  const mine = v === STUDIO_TZ ? "" : `<small>${esc(timeIn(c.start, v))} your time${dayKeyIn(c.start, v) !== dayKeyIn(c.start, STUDIO_TZ) ? " (" + esc(dayLabelIn(c.start, v).split(",")[0]) + ")" : ""}</small>`;
  return `<span class="when">${s}<small>to ${e} IST</small>${mine}</span>`;
}
function badge(c) {
  if (c.cancelled) return `<span class="badge cancelled">Cancelled</span>`;
  if (left(c) <= 0) return `<span class="badge full">Full</span>`;
  return `<span class="badge${left(c) <= 3 ? " few" : ""}">${left(c) <= 3 ? "Only " + left(c) + " left" : left(c) + " spots left"}</span>`;
}

/* ---------- views ---------- */
async function viewSchedule(root) {
  root.innerHTML = `<section class="hero"><h1>Find your class</h1><p>Small groups, unhurried pace. Pick a time and reserve your mat in under a minute. No account needed.</p>
    <span class="studio-tz">All times in studio time (Kolkata, IST)</span></section><div id="list" aria-busy="true"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>`;
  const list = $("#list", root);
  let failed = null;
  try { await api(); } catch (e) { failed = e; }
  if (!list.isConnected) return; // the visitor navigated away while loading
  if (failed) { const e = failed; list.innerHTML = failBox(e) + `<p style="margin-top:16px"><button class="btn" id="retry">Try again</button></p>`; list.removeAttribute("aria-busy"); $("#retry").onclick = () => viewSchedule(root); return; }
  const rows = upcoming().filter(c => c.start < Date.now() + 14 * 86400e3);
  list.removeAttribute("aria-busy");
  if (!rows.length) { list.innerHTML = `<div class="card empty"><h2>No classes in the next two weeks</h2><p>New classes are added regularly. Please check back soon.</p></div>`; return; }
  const byDay = new Map(); for (const c of rows) { const k = dayKeyIn(c.start, STUDIO_TZ); (byDay.get(k) ?? byDay.set(k, []).get(k)).push(c); }
  list.innerHTML = [...byDay.values()].map(cs => `<section class="day" aria-labelledby="d-${cs[0].id}"><h2 id="d-${cs[0].id}">${esc(dayLabelIn(cs[0].start, STUDIO_TZ))}</h2>${cs.map(c => `
    <article class="card cls${c.cancelled ? " is-cancelled" : ""}">${timeBlock(c)}
      <div class="what"><h3>${esc(c.title)}</h3><small>${c.dur} minutes</small></div>
      <div class="act">${badge(c)}${c.cancelled || left(c) <= 0 ? "" : ` <a class="btn primary" href="#/class/${c.id}" aria-label="Book ${esc(c.title)} at ${timeIn(c.start, STUDIO_TZ)} on ${esc(dayLabelIn(c.start, STUDIO_TZ))}">Book</a>`}</div>
    </article>`).join("")}</section>`).join("");
}

function viewBook(root, cid) {
  const c = classes.find(x => x.id === cid);
  if (!c) return viewNotFound(root);
  const closed = c.cancelled ? "This class has been cancelled." : c.start <= Date.now() ? "This class has already started." : left(c) <= 0 ? "This class is full." : "";
  root.innerHTML = `<p><a href="#/">Back to schedule</a></p><section class="hero" style="padding-bottom:8px"><h1>${esc(c.title)}</h1><p>${esc(dayLabelIn(c.start, STUDIO_TZ))}, ${timeIn(c.start, STUDIO_TZ)} to ${timeIn(c.start + c.dur * 60e3, STUDIO_TZ)} IST${visitorTz() === STUDIO_TZ ? "" : " (" + timeIn(c.start, visitorTz()) + " your time)"} &middot; ${badge(c)}</p></section>`;
  if (closed) { root.insertAdjacentHTML("beforeend", `<div class="notice" role="alert">${closed} <a href="#/">See other classes</a>.</div>`); return; }
  root.insertAdjacentHTML("beforeend", `<form class="card stack" novalidate aria-describedby="privacy">
    <div class="grid2"><label class="field">Your name<input class="input" name="name" autocomplete="name" maxlength="60" aria-describedby="e-name"><span class="err" id="e-name"></span></label>
    <label class="field">Email<input class="input" name="email" type="email" autocomplete="email" maxlength="120" aria-describedby="e-email"><span class="err" id="e-email"></span></label></div>
    <label class="hp" aria-hidden="true">Leave this empty<input name="website" tabindex="-1" autocomplete="off"></label>
    <p id="privacy" style="color:var(--muted);font-size:.9375rem">We store only your name and email, and delete them 90 days after the class. No emails are sent. You'll get a cancellation code on the next screen.</p>
    <div id="form-err" role="alert"></div>
    <button class="btn primary" type="submit">Reserve my spot</button></form>`);
  const f = $("form", root);
  f.onsubmit = async e => {
    e.preventDefault(); const name = f.name.value.trim(), email = f.email.value.trim(); let bad = false;
    const set = (k, m) => { $("#e-" + k).textContent = m; f[k].toggleAttribute("aria-invalid", !!m); if (m) { bad = true; } };
    set("name", name ? "" : "Please enter your name."); set("email", /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email) ? "" : "Please enter a valid email address.");
    if (bad) { (f.querySelector("[aria-invalid]")).focus(); return; }
    const btn = $("button[type=submit]", f); btn.disabled = true; btn.textContent = "Reserving…";
    try { await api(); } catch (er) { $("#form-err").innerHTML = failBox(er); btn.disabled = false; btn.textContent = "Reserve my spot"; return; }
    if (c.cancelled || left(c) <= 0) { $("#form-err").innerHTML = `<div class="notice err-box">Sorry, that class just filled up. <a href="#/">Choose another class</a>.</div>`; btn.remove(); live("Class is full"); return; }
    if (c.roster.some(r => r.email.toLowerCase() === email.toLowerCase())) { set("email", "This email already has a spot in this class."); btn.disabled = false; btn.textContent = "Reserve my spot"; f.email.focus(); return; }
    const bk = { name, email, code: code() }; c.roster.push(bk); lastBooking = { cls: c, bk }; location.hash = "#/confirmed";
  };
}

function viewConfirmed(root) {
  if (!lastBooking) { location.hash = "#/"; return; }
  const { cls: c, bk } = lastBooking;
  root.innerHTML = `<section class="card confirm"><div class="breath" aria-hidden="true"></div><h1>You're booked</h1>
    <p><strong>${esc(c.title)}</strong><br>${esc(dayLabelIn(c.start, STUDIO_TZ))}, ${timeIn(c.start, STUDIO_TZ)} IST</p>
    <p>Your cancellation code. <strong>Save it now: it is shown only once.</strong></p><div class="code" aria-label="Cancellation code">${esc(bk.code)}</div>
    <div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center"><button class="btn primary" id="ics">Add to calendar</button><a class="btn" href="#/">Back to schedule</a></div></section>`;
  $("#ics").onclick = () => {
    const z = ms => new Date(ms).toISOString().replace(/[-:]|\.\d{3}/g, "");
    const ics = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Studio Slot//EN", "BEGIN:VEVENT", "UID:" + c.id + "@studio-slot", "DTSTAMP:" + z(Date.now()), "DTSTART:" + z(c.start), "DTEND:" + z(c.start + c.dur * 60e3), "SUMMARY:" + c.title, "END:VEVENT", "END:VCALENDAR"].join("\r\n");
    const a = Object.assign(document.createElement("a"), { href: URL.createObjectURL(new Blob([ics], { type: "text/calendar" })), download: "studio-slot-class.ics" }); a.click(); URL.revokeObjectURL(a.href); live("Calendar file downloaded");
  };
  live("Booking confirmed");
}

function viewCancel(root) {
  root.innerHTML = `<section class="hero"><h1>Cancel a booking</h1><p>Enter the class and the code you were given when you booked. This frees your spot for someone else.</p></section>
    <form class="card stack" novalidate><label class="field">Class<select class="input" name="cls">${upcoming().filter(c => !c.cancelled).map(c => `<option value="${c.id}">${esc(dayLabelIn(c.start, STUDIO_TZ))}, ${timeIn(c.start, STUDIO_TZ)} - ${esc(c.title)}</option>`).join("")}</select></label>
    <label class="field">Cancellation code<input class="input" name="code" autocomplete="off" spellcheck="false" aria-describedby="e-code"><span class="err" id="e-code" role="alert"></span></label>
    <div id="cx"></div><button class="btn primary" type="submit">Cancel my spot</button></form>`;
  const f = $("form", root);
  f.onsubmit = async e => {
    e.preventDefault(); const v = f.code.value.trim().toUpperCase(); $("#e-code").textContent = ""; $("#cx").innerHTML = "";
    if (!v) { $("#e-code").textContent = "Please enter your code."; f.code.focus(); return; }
    try { await api(); } catch (er) { $("#cx").innerHTML = failBox(er); return; }
    const c = classes.find(x => x.id === f.cls.value), i = c.roster.findIndex(r => r.code === v);
    if (i < 0) { $("#e-code").textContent = "We couldn't find a booking with that class and code."; f.code.focus(); return; }
    c.roster.splice(i, 1); f.reset(); $("#cx").innerHTML = `<div class="notice" role="status">Your spot is cancelled. See you another time.</div>`; live("Booking cancelled");
  };
}

async function viewAdmin(root) {
  if (!session) {
    root.innerHTML = `<section class="hero"><h1>Owner sign in</h1></section><form class="card stack" novalidate style="max-width:460px"><div class="notice">Prototype only: the passphrase is <code>demo-passphrase</code>.</div>
      <label class="field">Passphrase<input class="input" type="password" name="pw" autocomplete="current-password" aria-describedby="e-pw"><span class="err" id="e-pw" role="alert"></span></label><button class="btn primary" type="submit">Sign in</button></form>`;
    $("form", root).onsubmit = async e => { e.preventDefault(); const f = e.target; try { await api(); } catch (er) { $("#e-pw").textContent = "Service unavailable. Try again shortly."; return; }
      if (f.pw.value === "demo-passphrase") { session = true; viewAdmin(root); live("Signed in"); } else { $("#e-pw").textContent = "That passphrase isn't right."; f.pw.focus(); } };
    return;
  }
  const rows = upcoming();
  root.innerHTML = `<section class="hero" style="display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:center"><h1>Classes</h1><button class="btn" id="out">Sign out</button></section>
    <form class="card stack" novalidate aria-labelledby="addh"><h2 id="addh">Add a class</h2><div class="grid2">
      <label class="field">Title<input class="input" name="t" maxlength="60" aria-describedby="e-t"><span class="err" id="e-t"></span></label>
      <label class="field">Date<input class="input" name="d" type="date" aria-describedby="e-d"><span class="err" id="e-d"></span></label>
      <label class="field">Start (studio time)<input class="input" name="h" type="time" aria-describedby="e-h"><span class="err" id="e-h"></span></label>
      <label class="field">Capacity (1 to 100)<input class="input" name="cap" type="number" min="1" max="100" value="12" aria-describedby="e-cap"><span class="err" id="e-cap"></span></label></div>
      <button class="btn primary" type="submit">Add class</button></form>
    <h2 style="margin-top:32px">Upcoming</h2>
    ${rows.map(c => `<article class="card acls"><header><div><h3>${esc(c.title)}</h3><span style="color:var(--muted)">${esc(dayLabelIn(c.start, STUDIO_TZ))}, ${timeIn(c.start, STUDIO_TZ)} IST &middot; ${c.roster.length}/${c.cap} booked</span></div>
      ${c.cancelled ? `<span class="badge cancelled">Cancelled</span>` : `<button class="btn danger" data-cancel="${c.id}" aria-label="Cancel class ${esc(c.title)} on ${esc(dayLabelIn(c.start, STUDIO_TZ))}">Cancel class</button>`}</header>
      ${c.roster.length ? `<ul class="rost" aria-label="Roster">${c.roster.map(r => `<li>${esc(r.name)} &middot; ${esc(r.email)}</li>`).join("")}</ul>` : `<p style="color:var(--muted)">No bookings yet.</p>`}</article>`).join("")}`;
  $("#out").onclick = () => { session = false; viewAdmin(root); live("Signed out"); };
  const f = $("form", root);
  f.onsubmit = e => { e.preventDefault(); let bad = false;
    const set = (k, m) => { $("#e-" + k).textContent = m; f[k].toggleAttribute("aria-invalid", !!m); if (m) bad = true; };
    const cap = Number(f.cap.value); const start = f.d.value && f.h.value ? Date.parse(f.d.value + "T" + f.h.value + ":00Z") - IST_MS : NaN;
    set("t", f.t.value.trim() ? "" : "Give the class a title."); set("d", f.d.value ? "" : "Pick a date."); set("h", f.h.value ? "" : "Pick a start time.");
    set("cap", Number.isInteger(cap) && cap >= 1 && cap <= 100 ? "" : "Capacity must be a whole number from 1 to 100.");
    if (!bad && !(start > Date.now())) set("d", "The class must start in the future.");
    if (bad) { f.querySelector("[aria-invalid]").focus(); return; }
    classes.push({ id: id(), title: f.t.value.trim(), start, dur: 60, cap, cancelled: false, roster: [] }); viewAdmin(root); live("Class added");
  };
  root.addEventListener("click", async e => { const b = e.target.closest("[data-cancel]"); if (!b) return; const c = classes.find(x => x.id === b.dataset.cancel);
    if (await confirmDialog("Cancel this class?", `${c.title} will show as cancelled. ${c.roster.length} booking(s) stay visible in the roster.`, "Cancel class")) { c.cancelled = true; viewAdmin(root); live("Class cancelled"); } });
}
function viewNotFound(root) { root.innerHTML = `<div class="card empty"><h1>Page not found</h1><p style="margin:8px 0 16px">That page doesn't exist.</p><a class="btn primary" href="#/">Back to the schedule</a></div>`; }

/* ---------- router ---------- */
const titles = { "/": "Schedule", "/cancel": "Cancel a booking", "/admin": "Owner", "/confirmed": "Booked" };
let first = true;
async function route() {
  const hash = location.hash.slice(1) || "/", main = $("#main"), m = hash.match(/^\/class\/([\w-]+)$/);
  if (m) viewBook(main, m[1]); else if (hash === "/") await viewSchedule(main); else if (hash === "/cancel") viewCancel(main);
  else if (hash === "/admin") await viewAdmin(main); else if (hash === "/confirmed") viewConfirmed(main); else viewNotFound(main);
  document.title = (m ? "Book a class" : titles[hash] || "Not found") + " · Studio Slot";
  document.querySelectorAll("nav a").forEach(a => a.dataset.route === (m || hash === "/confirmed" ? "/" : hash) ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"));
  if (!first) { main.focus({ preventScroll: true }); scrollTo(0, 0); } first = false;
}
addEventListener("hashchange", route);
$("#vtz").addEventListener("change", route);
route();
</script>
</body>
