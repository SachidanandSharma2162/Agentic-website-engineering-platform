# Weekly dependency update PRs.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /examples/focus-board
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    ignore:
      # TypeScript 7 fails `npm ci` here: typescript-eslint's peer range does not include it yet (PR #6 failed at install).
      # Remove this rule once typescript-eslint supports TypeScript 7.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
